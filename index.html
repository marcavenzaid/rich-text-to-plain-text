<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rich Text to Plain Text</title>
  <script src="js/theme.js"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header>
    <h1>Rich Text 🡒 Plain Text</h1>
    <button type="button" class="theme-toggle" id="themeToggle">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
  </header>

  <p class="description">Paste formatted text and get plain text back, with the math written out: 2<sup>31</sup> 🡒 2^31, fractions 🡒 a/b, roots 🡒 sqrt(x).</p>

  <div class="options">
    <span>Symbols:
      <span class="segmented" role="group" aria-label="Symbols">
        <button type="button" id="symUnicode" aria-pressed="true">Unicode (× ≤ π)</button>
        <button type="button" id="symAscii" aria-pressed="false">ASCII (* &lt;= pi)</button>
      </span>
    </span>
    <label><input type="checkbox" id="optScripts" checked> x² 🡒 x^2</label>
    <label><input type="checkbox" id="optLatex" checked> Convert LaTeX ($…$)</label>
    <label><input type="checkbox" id="optLinks"> Keep link URLs</label>
    <label><input type="checkbox" id="optAutoCopy"> Auto-copy result</label>
  </div>

  <main>
    <section class="panel">
      <div class="panel-head">
        <h2>Rich text</h2>
        <button type="button" id="exampleBtn">Example</button>
        <button type="button" id="pasteBtn">Paste from clipboard</button>
        <button type="button" id="clearBtn">Clear</button>
      </div>
      <div id="input" contenteditable="true" spellcheck="false" aria-label="Rich text input"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2>Plain text</h2>
        <span class="status" id="status"></span>
        <button type="button" id="downloadBtn">Download .txt</button>
        <button type="button" class="primary" id="copyBtn">Copy</button>
      </div>
      <textarea id="output" spellcheck="false" aria-label="Plain text output"></textarea>
    </section>
  </main>

  <script src="js/converter.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
